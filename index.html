<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barni Café</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f3ed;
      color: #3b2a20;
    }

    header {
      background: #3b2a20;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.8;
    }

    .hero {
      padding: 45px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #76675d;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #3b2a20;
      color: white;
      padding: 13px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 16px;
    }

    .menu {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .menu h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .product .emoji {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .product p {
      color: #8a7b70;
      margin-bottom: 12px;
    }

    .price {
      font-weight: bold;
      color: #3b2a20;
    }

    footer {
      margin-top: 45px;
      padding: 25px;
      background: #3b2a20;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>BARNI CAFÉ</h1>
    <p>قهوة تُحضّر بحب 🤎</p>
  </header>

  <section class="hero">
    <h2>مرحبًا بك في برني ☕</h2>
    <p>اختر طلبك واستمتع بتجربة Barni Café</p>
    <a href="#menu" class="btn">شوف المنيو</a>
  </section>

  <section class="menu" id="menu">
    <h2>المنيو</h2>

    <div class="products">

      <div class="product">
        <div class="emoji">☕</div>
        <h3>قهوة عربية</h3>
        <p>قهوة عربية بطابع برني</p>
        <div class="price">0.500 ر.ع</div>
      </div>

      <div class="product">
        <div class="emoji">🥜</div>
        <h3>مكسرات</h3>
        <p>مكسرات مشكلة</p>
        <div class="price">1.000 ر.ع</div>
      </div>

      <div class="product">
        <div class="emoji">🍪</div>
        <h3>سناك</h3>
        <p>اختيار خفيف ولذيذ</p>
        <div class="price">1.000 ر.ع</div>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 Barni Café</p>
  </footer>

</body>
</html>
